<!DOCTYPE html>
<html lang="en" class="scroll-smooth antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <meta name="description" content="Page not found">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/89532571" type="image/png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .page {
      min-height: 100vh;
      position: relative;
    }

    .text {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      margin: 0;
      font-size: clamp(6rem, 24vw, 20rem);
      line-height: 0.8;
      font-weight: 900;
      letter-spacing: -0.1em;
      color: #f9fafb;
      text-transform: uppercase;
      opacity: 0.98;
      user-select: none;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .text {
        right: 0.75rem;
        bottom: 0.75rem;
      }
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.setTimeout(() => {
        window.location.replace('/');
      }, 10000);
    });
  </script>
</head>
<body>
  <main class="page" aria-label="Page not found">
    <h1 class="text">404</h1>
  </main>
</body>
</html>
