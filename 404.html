<!DOCTYPE html>
<html lang="en" class="scroll-smooth antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <meta name="description" content="Page not found">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/89532571" type="image/png">
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #f3f4f6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .panel {
      width: min(42rem, 100%);
      border: 2px solid #111827;
      background: #000;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      border: 2px solid #111827;
      border-radius: 9999px;
      background: #000;
      color: #9ca3af;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .badge::before {
      content: '';
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 9999px;
      background: #6b7280;
      box-shadow: 0 0 0 0 rgba(107, 114, 128, 0.45);
      animation: pulseDot 2s ease-in-out infinite;
    }

    .copy {
      max-width: 30rem;
    }

    .title {
      margin: 0;
      font-size: clamp(4.25rem, 16vw, 7rem);
      line-height: 0.92;
      font-weight: 800;
      letter-spacing: -0.08em;
      color: #fff;
    }

    .subtitle {
      margin: 1rem 0 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #b0b0b0;
    }

    .meta {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.9rem;
      padding: 0.75rem 1.15rem;
      border-radius: 0.5rem;
      border: 2px solid #111827;
      background: #000;
      color: #9ca3af;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      background: #0c0c0c;
      color: #e5e7eb;
      border-color: #1f2937;
      outline: none;
    }

    .button.secondary {
      color: #6b7280;
      background: transparent;
    }

    .note {
      font-size: 0.85rem;
      color: #4b5563;
    }

    @keyframes pulseDot {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(107, 114, 128, 0.45);
      }

      50% {
        box-shadow: 0 0 0 0.45rem rgba(107, 114, 128, 0);
      }
    }

    @media (max-width: 768px) {
      .panel {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="page-title">
      <div class="badge">Lost signal</div>
      <div class="copy">
        <h1 class="title" id="page-title">404</h1>
        <p class="subtitle">This page isn’t here. The rest of the site still is.</p>
        <div class="meta">
          <a href="/" class="button">Back to home</a>
          <span class="note">Try the front page.</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
